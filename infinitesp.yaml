# Binary sensors
# ──────────────────────────────────────────────

binary_sensor:
#  - platform: gpio
#    pin: 
#      number: GPIO18
#      mode: INPUT_PULLUP # Add or remove pullup based on your sensor
#    name: "Monitored Pin State"
